name: Build Rust Project (Linux & Windows)

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      # The JVM tests boot an in-process JVM and compile a Java fixture.
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Formatting
        run: cargo fmt --all --check

      # Fails when mc-data changed without regenerating, or generated.rs was edited by hand.
      - name: Generated bindings are up to date
        run: cargo xtask bindgen --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.os == 'windows-latest' && 'nightly' || 'stable' }}
          components: rustfmt, clippy

      # Caches the Cargo registry, the git database and the target directory.
      # Keyed on the OS, the toolchain and Cargo.lock, so unchanged
      # dependencies are not rebuilt on every run.
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build crates
        run: cargo build --release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.os }}
          # Binary
          cp target/release/injector artifacts/${{ matrix.os}}/ || cp target/release/injector.exe artifacts/${{ matrix.os}}/
          # Libraries
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp target/release/libagent_loader.so artifacts/${{ matrix.os}}/
            cp target/release/libclient.so artifacts/${{ matrix.os}}/
          else
            cp target/release/agent_loader.dll artifacts/${{ matrix.os}}/
            cp target/release/client.dll artifacts/${{ matrix.os}}/
          fi

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}

      - name: Upload assets to GitHub Release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ matrix.os }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}