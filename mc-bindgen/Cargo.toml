[package]
name = "mc-bindgen"
version.workspace = true
edition.workspace = true
publish = false

# Tooling only — run through `cargo xtask`, never linked into the client or the
# injector, and left out of the workspace's default members.
[dependencies]
thiserror.workspace = true
noak = "0.7"
serde_json = "1.0"
sha1_smol = "1.0"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
